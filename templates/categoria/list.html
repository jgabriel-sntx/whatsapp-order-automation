{% extends "base.html" %}

{% block title %}Categorias{% endblock %}

{% block content %}
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="fw-bold mb-0">Categorias</h3>
        <a class="btn btn-success" href="{% url 'categoria_create' %}"><i class="fas fa-plus me-1"></i> Nova categoria</a>
    </div>

    <div class="card">
        <div class="list-group list-group-flush">
            {% for categoria in categorias %}
                <a class="list-group-item list-group-item-action" href="{% url 'categoria_detail' categoria.pk %}">{{ categoria.nome }}</a>
            {% empty %}
                <div class="list-group-item text-muted">Nenhuma categoria cadastrada.</div>
            {% endfor %}
        </div>
    </div>
{% endblock %}

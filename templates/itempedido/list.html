{% extends "base.html" %}

{% block title %}Itens de pedido{% endblock %}

{% block content %}
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="fw-bold mb-0">Itens de pedido</h3>
        <a class="btn btn-success" href="{% url 'itempedido_create' %}"><i class="fas fa-plus me-1"></i> Novo item de pedido</a>
    </div>

    <div class="card">
        <div class="list-group list-group-flush">
            {% for item in itens %}
                <a class="list-group-item list-group-item-action" href="{% url 'itempedido_detail' item.pk %}">{{ item.produto.nome }} - {{ item.quantidade }}x (Pedido #{{ item.pedido.pk }})</a>
            {% empty %}
                <div class="list-group-item text-muted">Nenhum item cadastrado.</div>
            {% endfor %}
        </div>
    </div>
{% endblock %}

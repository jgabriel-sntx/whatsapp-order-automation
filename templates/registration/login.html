{% extends "base.html" %}

{% block title %}Entrar{% endblock %}

{% block content %}
    <h2>Entrar</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit">Entrar</button>
    </form>

    <p>
        Ainda não tem conta? <a href="{% url 'empresa_create' %}">Cadastre sua empresa</a>
    </p>
{% endblock %}

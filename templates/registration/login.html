{% extends "base.html" %}

{% block title %}Entrar{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card">
                <div class="card-header">
                    <div class="card-title">Entrar</div>
                </div>
                <form method="post">
                    {% csrf_token %}
                    <div class="card-body">
                        {{ form.as_p }}
                        <input type="hidden" name="next" value="{{ next }}">
                    </div>
                    <div class="card-action">
                        <button type="submit" class="btn btn-success w-100"><i class="fas fa-sign-in-alt me-1"></i> Entrar</button>
                    </div>
                </form>
                <div class="card-footer text-center">
                    Ainda não tem conta? <a href="{% url 'empresa_create' %}">Cadastre sua empresa</a>
                </div>
            </div>
        </div>
    </div>
{% endblock %}

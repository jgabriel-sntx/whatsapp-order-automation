{% extends "base.html" %}

{% block title %}Excluir empresa{% endblock %}

{% block content %}
    <h2>Excluir empresa</h2>

    <p>Tem certeza que deseja excluir a empresa "{{ empresa.nome }}"?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Confirmar exclusão</button>
        <a href="{% url 'empresa_detail' empresa.pk %}">Cancelar</a>
    </form>
{% endblock %}

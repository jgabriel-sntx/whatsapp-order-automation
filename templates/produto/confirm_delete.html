{% extends "base.html" %}

{% block title %}Excluir produto{% endblock %}

{% block content %}
    <div class="card">
        <div class="card-header">
            <div class="card-title">Excluir produto</div>
        </div>
        <div class="card-body">
            <div class="alert alert-danger mb-0">Tem certeza que deseja excluir o produto "{{ produto.nome }}"?</div>
        </div>
        <form method="post">
            {% csrf_token %}
            <div class="card-action">
                <button type="submit" class="btn btn-danger"><i class="fas fa-trash me-1"></i> Confirmar exclusão</button>
                <a class="btn btn-secondary" href="{% url 'produto_detail' produto.pk %}"><i class="fas fa-arrow-left me-1"></i> Cancelar</a>
            </div>
        </form>
    </div>
{% endblock %}

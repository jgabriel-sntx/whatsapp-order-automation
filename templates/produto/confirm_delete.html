{% extends "base.html" %}

{% block title %}Excluir produto{% endblock %}

{% block content %}
    <h2>Excluir produto</h2>

    <p>Tem certeza que deseja excluir o produto "{{ produto.nome }}"?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Confirmar exclusão</button>
        <a href="{% url 'produto_detail' produto.pk %}">Cancelar</a>
    </form>
{% endblock %}

{% extends "base.html" %}

{% block title %}{% if form.instance.pk %}Editar produto{% else %}Novo produto{% endif %}{% endblock %}

{% block content %}
    <h2>{% if form.instance.pk %}Editar produto{% else %}Novo produto{% endif %}</h2>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Salvar</button>
    </form>

    <p>
        <a href="{% url 'produto_list' %}">Voltar</a>
    </p>
{% endblock %}

{% extends "base.html" %}

{% block title %}Produtos{% endblock %}

{% block content %}
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="fw-bold mb-0">Produtos</h3>
        <a class="btn btn-success" href="{% url 'produto_create' %}"><i class="fas fa-plus me-1"></i> Novo produto</a>
    </div>

    <div class="card">
        <div class="list-group list-group-flush">
            {% for produto in produtos %}
                <a class="list-group-item list-group-item-action" href="{% url 'produto_detail' produto.pk %}">{{ produto.nome }}</a>
            {% empty %}
                <div class="list-group-item text-muted">Nenhum produto cadastrado.</div>
            {% endfor %}
        </div>
    </div>
{% endblock %}

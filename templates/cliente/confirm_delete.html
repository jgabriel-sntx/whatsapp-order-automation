{% extends "base.html" %}

{% block title %}Excluir cliente{% endblock %}

{% block content %}
    <h2>Excluir cliente</h2>

    <p>Tem certeza que deseja excluir o cliente "{{ cliente.nome }}"?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Confirmar exclusão</button>
        <a href="{% url 'cliente_detail' cliente.pk %}">Cancelar</a>
    </form>
{% endblock %}

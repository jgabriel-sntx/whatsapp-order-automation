{% extends "base.html" %}

{% block title %}Clientes{% endblock %}

{% block content %}
    <h2>Clientes</h2>

    <p>
        <a href="{% url 'cliente_create' %}">Novo cliente</a>
    </p>

    <ul>
        {% for cliente in clientes %}
            <li>
                <a href="{% url 'cliente_detail' cliente.pk %}">{{ cliente.nome }}</a>
            </li>
        {% empty %}
            <li>Nenhum cliente cadastrado.</li>
        {% endfor %}
    </ul>
{% endblock %}

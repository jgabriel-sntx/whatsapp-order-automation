{% extends "base.html" %}

{% block title %}{% if form.instance.pk %}Editar cliente{% else %}Novo cliente{% endif %}{% endblock %}

{% block content %}
    <h2>{% if form.instance.pk %}Editar cliente{% else %}Novo cliente{% endif %}</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Salvar</button>
    </form>

    <p>
        <a href="{% url 'cliente_list' %}">Voltar</a>
    </p>
{% endblock %}

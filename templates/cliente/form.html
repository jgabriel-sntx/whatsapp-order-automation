{% extends "base.html" %}

{% block title %}{% if form.instance.pk %}Editar cliente{% else %}Novo cliente{% endif %}{% endblock %}

{% block content %}
    <div class="card">
        <div class="card-header">
            <div class="card-title">{% if form.instance.pk %}Editar cliente{% else %}Novo cliente{% endif %}</div>
        </div>
        <form method="post">
            {% csrf_token %}
            <div class="card-body">
                {{ form.as_p }}
            </div>
            <div class="card-action">
                <button type="submit" class="btn btn-success"><i class="fas fa-save me-1"></i> Salvar</button>
                <a class="btn btn-secondary" href="{% url 'cliente_list' %}"><i class="fas fa-arrow-left me-1"></i> Voltar</a>
            </div>
        </form>
    </div>
{% endblock %}

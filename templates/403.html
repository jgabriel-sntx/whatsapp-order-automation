{% extends "base.html" %}

{% block title %}Acesso negado{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card text-center">
                <div class="card-body py-5">
                    <h1 class="display-4 fw-bold text-danger">403</h1>
                    <h4 class="fw-bold">Acesso negado</h4>
                    <p class="text-muted">
                        Você não tem permissão para acessar esta página
                        ou realizar esta ação.
                    </p>
                    {% if user.is_authenticated %}
                        <a class="btn btn-primary" href="{% url 'index' %}"><i class="fas fa-home me-1"></i> Ir para o início</a>
                    {% else %}
                        <a class="btn btn-success" href="{% url 'login' %}"><i class="fas fa-sign-in-alt me-1"></i> Entrar</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
{% endblock %}
